<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday, My Friend! 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.35), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.25), transparent 22%),
        linear-gradient(135deg, #ff758c 0%, #ff7eb3 45%, #7f7fd5 100%);
      color: #fff;
      display: grid;
      place-items: center;
      position: relative;
    }

    .card {
      width: min(92%, 650px);
      padding: clamp(2rem, 7vw, 4.5rem) clamp(1.4rem, 6vw, 3.5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 30px;
      box-shadow: 0 25px 70px rgba(50, 20, 80, .28);
      z-index: 2;
      animation: float 4s ease-in-out infinite;
    }

    .cake {
      font-size: clamp(4rem, 18vw, 7rem);
      line-height: 1;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.15));
      animation: bounce 1.8s ease-in-out infinite;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.4rem, 9vw, 4.8rem);
      line-height: .95;
      letter-spacing: -2px;
      text-shadow: 0 5px 20px rgba(80, 20, 90, .25);
    }

    .name {
      display: inline-block;
      margin-top: .8rem;
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      font-weight: 800;
      color: #fff4a8;
    }

    .message {
      max-width: 520px;
      margin: 1.5rem auto 0;
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      line-height: 1.65;
      color: rgba(255,255,255,.94);
    }

    .btn {
      margin-top: 2rem;
      border: 0;
      border-radius: 999px;
      padding: .9rem 1.5rem;
      font-size: 1rem;
      font-weight: 800;
      color: #8d3d72;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(50,20,80,.2);
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { transform: translateY(-3px) scale(1.02); }
    .btn:active { transform: scale(.96); }

    .hint {
      margin-top: .8rem;
      font-size: .8rem;
      opacity: .7;
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      font-size: clamp(2rem, 8vw, 4rem);
      animation: rise linear infinite;
      opacity: .75;
      z-index: 1;
      user-select: none;
    }

    .b1 { left: 4%; animation-duration: 11s; animation-delay: -2s; }
    .b2 { left: 22%; animation-duration: 14s; animation-delay: -8s; }
    .b3 { right: 18%; animation-duration: 12s; animation-delay: -5s; }
    .b4 { right: 3%; animation-duration: 15s; animation-delay: -11s; }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bounce {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-10px); }
    }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-125vh) rotate(360deg); }
    }

    @media (max-width: 480px) {
      .card { border-radius: 24px; }
      .message { line-height: 1.55; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <main class="card">
    <div class="cake">🎂</div>
    <h1>Happy Birthday!</h1>
    <div class="name">My Amazing Friend 💖</div>

    <p class="message">
      Wishing you a day filled with laughter, love, unforgettable moments,
      and all the happiness you deserve. May this new year of your life
      bring you countless adventures and beautiful memories! ✨
    </p>

    <button class="btn" id="celebrate">🎉 Celebrate!</button>
    <div class="hint">Tap the button for more confetti!</div>
  </main>

  <script>
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function createConfetti(count = 180) {
      pieces = [];
      for (let i = 0; i < count; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -Math.random() * canvas.height * .7,
          w: 6 + Math.random() * 8,
          h: 5 + Math.random() * 11,
          vx: (Math.random() - .5) * 5,
          vy: 2 + Math.random() * 5,
          gravity: .045 + Math.random() * .055,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - .5) * .25,
          hue: Math.floor(Math.random() * 360),
          opacity: 1
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach((p, i) => {
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;

        if (p.y > canvas.height + 30) {
          pieces.splice(i, 1);
          return;
        }

        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = `hsl(${p.hue}, 90%, 60%)`;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });

      requestAnimationFrame(animate);
    }

    document.getElementById("celebrate").addEventListener("click", () => {
      createConfetti(260);
    });

    // Confetti starts automatically.
    createConfetti(220);
    animate();
  </script>
</body>
</html>
